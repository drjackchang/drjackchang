name: Sync ORCID publications

on:
  schedule:
    - cron: "0 0 * * 1"   # 每週一 00:00 UTC
  workflow_dispatch: {}     # 允許在 Actions 頁籤手動觸發

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ORCID sync
        run: node scripts/sync-orcid.js

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain data/publications.json)" ]; then
            git config user.name "orcid-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/publications.json
            git commit -m "chore: sync new publications from ORCID"
            git push
          else
            echo "No changes to commit."
          fi
