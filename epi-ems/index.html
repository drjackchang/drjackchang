<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>流行病學方法論 EMS 版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: registry-report shell — fixed week index on the left (grouped by course phase), one week per view on the right; collapses to a top drawer on phones. */
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --ink: #142028;
  --muted: #5b6b74;
  --line: #d9e1e4;
  --accent: #0d6b6e;
  --accent-soft: #e2f0ef;
  --signal: #b4641a;
  --signal-soft: #f8ecdf;
  --code-bg: #0f1d24;
  --code-ink: #dbe7ea;
  --ok: #2f7d4b;
  --bad: #b03a2e;
  --font-display: "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side: 272px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e171c; --surface: #15232a; --ink: #e3ecef; --muted: #93a6ae; --line: #26363e;
  --accent: #4fb3b0; --accent-soft: #173a3c; --signal: #e0a160; --signal-soft: #3a2a19;
  --code-bg: #091216; --code-ink: #d6e3e6; --ok: #6cc08a; --bad: #e57d70; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e171c; --surface: #15232a; --ink: #e3ecef; --muted: #93a6ae; --line: #26363e;
  --accent: #4fb3b0; --accent-soft: #173a3c; --signal: #e0a160; --signal-soft: #3a2a19;
  --code-bg: #091216; --code-ink: #d6e3e6; --ok: #6cc08a; --bad: #e57d70; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
a { color: var(--accent) }
a:focus-visible, button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0 }
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh }

/* sidebar */
.side { border-right: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px }
.brand { display: grid; gap: 2px; margin-bottom: 18px; text-decoration: none; color: var(--ink) }
.brand b { font-family: var(--font-display); font-size: 20px; letter-spacing: .02em }
.brand span { font-size: 12px; color: var(--muted) }
.navtop { display: grid; gap: 2px; margin-bottom: 18px }
.navtop a, .wk { display: flex; gap: 10px; align-items: baseline; padding: 5px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 14px }
.navtop a:hover, .wk:hover { background: var(--accent-soft) }
.navtop a.on, .wk.on { background: var(--accent); color: #fff }
.phase { margin-top: 14px }
.phase h4 { margin: 0 0 4px 8px; font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 700 }
.wk .no { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 30px; font-variant-numeric: tabular-nums }
.wk.on .no { color: #d8f0ef }
.wk .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.menu-btn { display: none }

/* main */
main { min-width: 0; padding-block: 28px 64px; padding-left: clamp(16px, 4vw, 48px); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 880px }
.statusbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin-bottom: 18px; font-size: 13px; color: var(--muted) }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 12.5px }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted) }
.pill.ready .dot { background: var(--ok) } .pill.loading .dot { background: var(--signal) } .pill.fail .dot { background: var(--bad) }

.eyebrow { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .08em; color: var(--signal); font-variant-numeric: tabular-nums }
.wtitle { font-family: var(--font-display); font-size: clamp(24px, 3.4vw, 32px); margin: 4px 0 10px }
.lede { font-size: 17px; max-width: 62ch; margin: 0 0 22px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 28px }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0 }
.box h3 { font-size: 13px; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin-bottom: 6px }
.box ul { margin: 0; padding-left: 1.2em }
.report { background: var(--signal-soft); border-color: transparent }
.report h3 { color: var(--signal) }
.report .q { margin: 6px 0 0 }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px }
.chip { font-family: var(--font-mono); font-size: 12.5px; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); text-decoration: none }

/* code chunks */
.chunks { display: grid; gap: 26px }
.chunk h2 { font-size: 18px; font-weight: 700; display: flex; gap: 10px; align-items: baseline }
.chunk h2 .k { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-weight: 400 }
.chunk p.ex { margin: 6px 0 10px; max-width: 68ch; white-space: pre-line }
.editor { position: relative; border-radius: 10px; overflow: hidden; background: var(--code-bg) }
.editor textarea { display: block; width: 100%; border: 0; resize: vertical; background: transparent; color: var(--code-ink);
  font-family: var(--font-mono); font-size: 13px; line-height: 1.6; padding: 14px 16px; tab-size: 2; white-space: pre; overflow-x: auto; min-height: 60px }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center }
button { font: inherit; font-size: 13.5px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 12px; cursor: pointer }
button.run { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500 }
button:disabled { opacity: .55; cursor: progress }
.out { margin-top: 10px; display: grid; gap: 8px }
.out .lab { font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 700 }
pre.res { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-family: var(--font-mono);
  font-size: 12.5px; line-height: 1.55; overflow-x: auto; white-space: pre; font-variant-numeric: tabular-nums }
pre.res.err { border-color: var(--bad); color: var(--bad) }
.fig { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px; max-width: 640px }
.fig img, .fig canvas { display: block; width: 100%; height: auto }
.live { border-left: 3px solid var(--accent); padding-left: 10px }

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: 12.5px; color: var(--muted); font-weight: 700; letter-spacing: .04em; background: var(--bg) }
tr:last-child td { border-bottom: 0 }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap }
details { margin-top: 4px } summary { cursor: pointer; color: var(--accent); font-size: 13px }
dl.cols { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 8px 0 0; font-size: 13px }
dl.cols dt { font-family: var(--font-mono); color: var(--accent) } dl.cols dd { margin: 0 }

.home-hero { display: grid; gap: 10px; margin-bottom: 26px }
.home-hero h1 { font-family: var(--font-display); font-size: clamp(28px, 4.4vw, 40px) }
.arc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 8px 0 28px; background: var(--surface) }
.arc a { padding: 14px 16px; text-decoration: none; color: var(--ink); border-right: 1px solid var(--line); display: grid; gap: 2px }
.arc a:last-child { border-right: 0 }
.arc b { font-family: var(--font-display); font-size: 20px } .arc .r { font-family: var(--font-mono); font-size: 12px; color: var(--signal) }
.arc span.d { font-size: 13px; color: var(--muted) }
.sec { margin: 30px 0 12px; font-family: var(--font-display); font-size: 21px }
.note { font-size: 13.5px; color: var(--muted); max-width: 70ch }
.matrix td, .matrix th { min-width: 120px }
.dag { max-width: 620px }
.dag text { fill: var(--ink); font-family: var(--font-body); font-size: 13px }
.dag .n rect { fill: var(--surface); stroke: var(--line) }
.dag .n.x rect { fill: var(--accent-soft); stroke: var(--accent) }
.dag .n.y rect { fill: var(--signal-soft); stroke: var(--signal) }
.dag .e { stroke: var(--muted); stroke-width: 1.4; fill: none }


/* indicators */
.inds { display: grid; gap: 14px; margin-bottom: 30px }
.ind { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0 }
.ind header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 6px }
.ind header b { font-size: 17px } .ind header i { font-style: normal; color: var(--muted); font-size: 13px }
.ind .def { margin: 0 0 10px; max-width: 72ch }
.formula { font-family: var(--font-mono); font-size: 13px; background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: 8px 12px; margin: 0 0 12px; overflow-x: auto; white-space: pre-wrap }
.ind dl { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 14px }
.ind dt { color: var(--muted); font-weight: 700; font-size: 13px; padding-top: 1px }
.ind dd { margin: 0 }
.ind dd.ex { color: var(--signal) }
.ind .wks { font-size: 12.5px; color: var(--muted); margin-top: 8px }
.studio { background: var(--surface); border: 1px dashed var(--accent); border-radius: 10px; padding: 14px 18px; margin-bottom: 26px }
.studio h3 { font-size: 15px; margin-bottom: 6px; color: var(--accent) }
.studio ol { margin: 0; padding-left: 1.3em }
.studio code, .note code, p code, li code { font-family: var(--font-mono); font-size: .92em; background: var(--accent-soft); padding: 0 4px; border-radius: 4px }
.tryit { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line) }
.tryit b { color: var(--signal) }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 14px 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; overflow-x: auto; white-space: pre; tab-size: 2 }
pre.code .cm { color: #8fb3a8 }
.glo-cat { margin-top: 28px }
kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface) }
.dl { display: inline-block; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 500 }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr) }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .menu-btn { display: inline-block }
  .ind dl { grid-template-columns: minmax(0, 1fr) } .ind dt { padding-top: 6px }
  .side .navwrap { display: none } .side.open .navwrap { display: block }
  .sidehead { display: flex; justify-content: space-between; align-items: center; gap: 10px }
  .brand { margin-bottom: 0 }
  .arc { grid-template-columns: minmax(0, 1fr) } .arc a { border-right: 0; border-bottom: 1px solid var(--line) }
}
@media (prefers-reduced-motion: no-preference) { .view { animation: fade .18s ease-out } @keyframes fade { from { opacity: .4 } to { opacity: 1 } } }
</style>

<div class="shell">
  <aside class="side" id="side">
    <div class="sidehead">
      <a class="brand" href="#home"><b>流行病學方法論</b><span>EMS 與災難數據版 · 115-2</span></a>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">週次</button>
    </div>
    <div class="navwrap">
      <nav class="navtop" id="navtop"></nav>
      <nav id="nav"></nav>
    </div>
  </aside>
  <main>
    <div class="wrap">
      <div id="view" class="view"></div>
    </div>
  </main>
</div>

<script src="weeks.js"></script>
<script src="indicators.js"></script>
<script src="outputs.js"></script>
<script>
(function () {
  const C = window.COURSE, D = window.DATASETS, IND = window.INDICATORS || [], CODE = window.WEEK_CODE || {};
  const pad = n => String(n).padStart(2, "0");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ZIP = "epi-ems-rstudio.zip";

  // ---------- navigation ----------
  const navtop = document.getElementById("navtop"), nav = document.getElementById("nav");
  navtop.innerHTML = [["home", "課程首頁"], ["setup", "RStudio 準備"], ["glossary", "指標辭典"], ["data", "資料與變項說明"], ["reports", "年報與 Utstein 報告"]]
    .map(([h, t]) => `<a href="#${h}" data-h="${h}">${t}</a>`).join("");
  nav.innerHTML = C.phases.map(p => `<div class="phase"><h4>${p.name} · ${p.range}</h4>` +
    C.weeks.filter(w => w.phase === p.id).map(w =>
      `<a class="wk" href="#w${pad(w.n)}" data-h="w${pad(w.n)}"><span class="no">W${pad(w.n)}</span><span class="t">${esc(w.title)}</span></a>`).join("") + "</div>").join("");
  const side = document.getElementById("side"), menuBtn = document.getElementById("menuBtn");
  menuBtn.addEventListener("click", () => { const o = side.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", o) });

  // ---------- views ----------
  const view = document.getElementById("view");
  function route() {
    const h = (location.hash || "#home").slice(1);
    document.querySelectorAll("[data-h]").forEach(a => a.classList.toggle("on", a.dataset.h === h));
    side.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false");
    if (/^w\d\d$/.test(h)) renderWeek(+h.slice(1));
    else if (h === "data") renderData();
    else if (h === "reports") renderReports();
    else if (h === "setup") renderSetup();
    else if (h === "glossary") renderGlossary();
    else renderHome();
    view.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", onCopy));
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  const weekLink = n => `<a href="#w${pad(n)}">W${pad(n)}</a>`;

  function renderHome() {
    view.innerHTML = `
      <div class="home-hero">
        <div class="eyebrow">健康科技學院碩士班 · 選修 · 115 學年度第 2 學期</div>
        <h1>流行病學方法論<br>EMS 與災難數據版</h1>
        <p class="lede">同一套流行病學方法，換成救護出勤、OHCA 登錄、創傷登錄與災後調查的數據來練習。每週先弄懂指標的定義與用途，再讀一份真實年報，最後在 RStudio 用虛構城市「北濱市」的模擬資料親手算一次。</p>
        <p class="note">${esc(C.meta)}</p>
        <p><a class="dl" href="${ZIP}" download>下載 R 專案（資料＋每週程式）</a>　<a href="#setup">第一次使用請先看 RStudio 準備 →</a></p>
      </div>
      <div class="arc">${C.phases.map(p => {
        const first = C.weeks.find(w => w.phase === p.id);
        return `<a href="#w${pad(first.n)}"><span class="r">${p.range}</span><b>${p.name}</b><span class="d">${esc(p.desc)}</span></a>`}).join("")}</div>
      <h2 class="sec">18 週進度</h2>
      <div class="tbl"><table>
        <thead><tr><th>週</th><th>日期</th><th>單元</th><th>本週指標</th></tr></thead>
        <tbody>${C.weeks.map(w => `<tr><td class="num"><a href="#w${pad(w.n)}">W${pad(w.n)}</a></td><td class="num">${w.date}</td>
          <td>${esc(w.title)}</td><td>${IND.filter(x => x.weeks[0] === w.n).map(x => esc(x.zh)).join("、") || "—"}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">日期依 2027/2/25 開課推算，以學校公告校曆為準。所有資料皆為教學用模擬資料，不代表任何真實個人、機構或地區。</p>`;
  }

  function renderSetup() {
    view.innerHTML = `<div class="eyebrow">SETUP · 第一週上課前完成</div><h1 class="wtitle">RStudio 準備</h1>
      <p class="lede">整學期都用同一個 R 專案：開一次專案，之後每週只要打開當週的程式檔逐段執行。</p>
      <h2 class="sec">一次性設定</h2>
      <div class="studio"><ol>
        <li>安裝 R（<a href="https://cran.r-project.org/" target="_blank" rel="noopener">CRAN</a>），再安裝 RStudio Desktop（<a href="https://posit.co/download/rstudio-desktop/" target="_blank" rel="noopener">Posit</a>）。順序不能顛倒。</li>
        <li>下載 <a href="${ZIP}" download><code>${ZIP}</code></a>，解壓縮到<strong>沒有中文與空白</strong>的路徑，例如 <code>C:\\R\\epi-ems</code> 或 <code>~/R/epi-ems</code>。</li>
        <li>雙擊資料夾裡的 <code>epi-ems.Rproj</code>。RStudio 會把工作目錄自動設在專案資料夾，程式中的 <code>data/ohca.csv</code> 就找得到。</li>
        <li>在 Console 執行一次 <code>install.packages("survival")</code>（第 7、13 週用到；其他週只用 R 內建函式）。</li>
        <li>打開 <code>R/weeks/w01.R</code>，按 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Enter</kbd>（Mac：<kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>Enter</kbd>）整份執行。看到 <code>36499 10</code> 就代表設定完成。</li>
      </ol></div>
      <h2 class="sec">每週上課怎麼跟</h2>
      <div class="studio"><ol>
        <li>開啟 <code>epi-ems.Rproj</code> → 右下 Files 窗格進入 <code>R/weeks/</code> → 打開當週檔案，例如 <code>w05.R</code>。</li>
        <li>每個 <code>## ----</code> 是一段。游標放在該段，按 <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 逐行執行，一邊對照網站上的「參考輸出」。</li>
        <li>按 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>O</kbd> 可開啟文件大綱，直接跳到某一段。</li>
        <li>每週頁面最後有「動手改一改」：改一個參數再跑一次，把結果寫進課堂筆記。</li>
      </ol></div>
      <h2 class="sec">常見問題</h2>
      <div class="tbl"><table><thead><tr><th>訊息</th><th>原因與解法</th></tr></thead><tbody>
        <tr><td><code>cannot open file 'data/ohca.csv'</code></td><td>沒有從 <code>epi-ems.Rproj</code> 開啟，工作目錄不對。關掉 RStudio，改雙擊 <code>.Rproj</code>；或 Session → Set Working Directory → To Project Directory。</td></tr>
        <tr><td><code>object 'ohca' not found</code></td><td>跳著執行。請從該週第一段依序往下跑。</td></tr>
        <tr><td><code>there is no package called 'survival'</code></td><td>執行 <code>install.packages("survival")</code>。</td></tr>
        <tr><td>程式中的中文變亂碼</td><td>File → Reopen with Encoding → UTF-8；並在 Tools → Global Options → Code → Saving 把預設編碼設為 UTF-8。</td></tr>
        <tr><td>圖的中文字變方塊</td><td>課程的圖都使用英文標籤；自己加中文標籤時，Windows 可加 <code>par(family = "Microsoft JhengHei")</code>。</td></tr>
      </tbody></table></div>`;
  }

  function indCard(x, showWeeks) {
    return `<article class="ind" id="ind-${x.id}">
      <header><b>${esc(x.zh)}</b><i>${esc(x.en)}</i></header>
      <p class="def">${esc(x.def)}</p>
      <div class="formula">${esc(x.formula)}</div>
      <dl><dt>為什麼用</dt><dd>${esc(x.why)}</dd><dt>怎麼解讀</dt><dd>${esc(x.how)}</dd>
      <dt>常見錯誤</dt><dd>${esc(x.pitfall)}</dd><dt>北濱市</dt><dd class="ex">${esc(x.ex)}</dd></dl>
      ${showWeeks ? `<div class="wks">出現週次：${x.weeks.map(weekLink).join(" ")}</div>` : ""}
    </article>`;
  }

  function renderGlossary() {
    const cats = [...new Set(IND.map(x => x.cat))];
    view.innerHTML = `<div class="eyebrow">GLOSSARY · ${IND.length} 個指標</div><h1 class="wtitle">指標辭典</h1>
      <p class="lede">每個指標都回答五件事：它是什麼、怎麼算、什麼時候該用、數字怎麼讀、最常犯的錯。考試與報告請以這裡的定義為準。</p>
      <div class="tbl"><table><thead><tr><th>分類</th><th>指標</th></tr></thead><tbody>
      ${cats.map(c => `<tr><td><b>${esc(c)}</b></td><td>${IND.filter(x => x.cat === c).map(x => `<a href="#glossary" data-jump="ind-${x.id}">${esc(x.zh)}</a>`).join("、")}</td></tr>`).join("")}
      </tbody></table></div>
      ${cats.map(c => `<h2 class="sec glo-cat">${esc(c)}</h2><div class="inds">${IND.filter(x => x.cat === c).map(x => indCard(x, true)).join("")}</div>`).join("")}`;
    view.querySelectorAll("[data-jump]").forEach(a => a.addEventListener("click", e => {
      e.preventDefault(); document.getElementById(a.dataset.jump).scrollIntoView({ behavior: "smooth", block: "start" }) }));
  }

  function renderData() {
    view.innerHTML = `<div class="eyebrow">DATA · 北濱市（虛構）</div><h1 class="wtitle">資料與變項說明</h1>
      <p class="lede">15 份 CSV 都在 R 專案的 <code>data/</code> 資料夾，由 <code>R/sim_data.R</code>（固定亂數種子）產生；全班拿到的資料完全相同。</p>
      <p><a class="dl" href="${ZIP}" download>下載 R 專案</a></p>
      <div class="tbl"><table><thead><tr><th>檔案</th><th>內容</th><th>筆數</th><th>週次</th></tr></thead><tbody>
      ${D.map(d => `<tr id="ds-${d.file}"><td><a class="chip" href="data/${d.file}" download>${d.file}</a></td>
        <td><b>${esc(d.name)}</b><br><span class="note">${esc(d.desc)}</span>
        <details><summary>欄位說明</summary><dl class="cols">${Object.entries(d.cols).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></details></td>
        <td class="num">${d.rows.toLocaleString()}</td><td class="num">${d.weeks.map(weekLink).join(" ")}</td></tr>`).join("")}
      </tbody></table></div>`;
  }

  function renderReports() {
    const seen = new Map();
    C.weeks.forEach(w => [w.report, w.extraReport].filter(Boolean).forEach(r => {
      if (!seen.has(r.url)) seen.set(r.url, { name: r.name.split("：")[0], url: r.url, weeks: [] });
      if (!seen.get(r.url).weeks.includes(w.n)) seen.get(r.url).weeks.push(w.n);
    }));
    view.innerHTML = `<div class="eyebrow">REPORTS</div><h1 class="wtitle">年報與 Utstein 報告</h1>
      <p class="lede">每週的「年報對照」都從這些報告出題：先在真實報告裡找到指標，確認它的分子與分母，再用模擬資料重算一次。</p>
      <div class="tbl"><table><thead><tr><th>報告</th><th>週次</th></tr></thead><tbody>
      ${[...seen.values()].map(r => `<tr><td><a href="${r.url}" target="_blank" rel="noopener">${esc(r.name)}</a></td><td class="num">${r.weeks.map(weekLink).join(" ")}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="note">台灣目前沒有全國統一的 OHCA 與創傷登錄年報；這個缺口本身就是第 2 週與第 18 週的討論題。</p>`;
  }

  function haddonTable() {
    const rows = ["事前（Pre-event）", "事中（Event）", "事後（Post-event）"], cols = ["宿主（人）", "媒介／載具", "物理環境", "社會環境"];
    return `<h2 class="sec">課堂實作：Haddon 矩陣</h2><p class="note">以「夜間機車自撞」為例，每格寫一個可介入的因子，並標出屬於初段、次段或末段預防。</p>
      <div class="tbl"><table class="matrix"><thead><tr><th></th>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>
      ${rows.map((r, i) => `<tr><th>${r}</th>${cols.map((c, j) => `<td>${i === 0 && j === 0 ? "酒後駕駛、疲勞" : i === 1 && j === 1 ? "安全帽品質" : i === 2 && j === 3 ? "旁觀者止血與報案" : ""}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>`;
  }

  function dagSvg() {
    const N = [["rural", "鄉村區", 40, 30, ""], ["age", "年齡", 260, 30, ""], ["resp", "反應時間", 40, 150, "x"], ["cpr", "旁觀者 CPR", 260, 100, ""],
               ["rhythm", "初始心律", 260, 200, ""], ["surv", "存活出院", 480, 150, "y"]];
    const pos = Object.fromEntries(N.map(n => [n[0], [n[2] + 55, n[3] + 18]]));
    const E = [["rural", "resp"], ["rural", "cpr"], ["rural", "age"], ["age", "surv"], ["cpr", "surv"], ["resp", "rhythm"], ["rhythm", "surv"], ["resp", "surv"], ["cpr", "rhythm"]];
    const line = ([a, b]) => { const [x1, y1] = pos[a], [x2, y2] = pos[b]; const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
      const s = 34 / L, t = (L - 40) / L; return `<line class="e" x1="${x1 + dx * s}" y1="${y1 + dy * s}" x2="${x1 + dx * t}" y2="${y1 + dy * t}" marker-end="url(#ah)"/>` };
    return `<h2 class="sec">本週 DAG</h2><div class="tbl" style="padding:10px"><svg class="dag" viewBox="0 0 600 250" role="img" aria-label="反應時間與存活的有向無環圖">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--muted)"/></marker></defs>
      ${E.map(line).join("")}
      ${N.map(n => `<g class="n ${n[4]}"><rect x="${n[2]}" y="${n[3]}" width="110" height="36" rx="8"/><text x="${n[2] + 55}" y="${n[3] + 23}" text-anchor="middle">${n[1]}</text></g>`).join("")}
      </svg></div><p class="note">要估反應時間的「總效應」：調整鄉村區（打斷後門路徑），不調整初始心律（中介）。程式中的三個模型就是這三種選擇。</p>`;
  }

  function checklistTable() {
    const rows = [["OHCA 登錄研究", "Utstein 2024", "流程圖、Utstein 比較組、核心時間點"], ["觀察性研究（世代、病例對照、橫斷）", "STROBE", "研究對象選取、偏誤處理、遺漏值"],
      ["例行收集資料（登錄、健保、救護紀錄）", "RECORD", "資料連結與代碼定義"], ["診斷／檢傷工具準確度", "STARD", "參考標準、2×2 表、不確定結果"], ["隨機試驗", "CONSORT", "CONSORT 流程圖、ITT、主要結果"]];
    return `<h2 class="sec">報告指引對照</h2><div class="tbl"><table><thead><tr><th>文章類型</th><th>指引</th><th>導讀時至少檢查</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">指引全文見 <a href="https://www.equator-network.org/" target="_blank" rel="noopener">EQUATOR Network</a>。導讀當日繳交 PDF。</p>`;
  }

  function studioBox(w, hasCode) {
    if (!hasCode) return "";
    return `<div class="studio"><h3>在 RStudio 跟著做</h3><ol>
      <li>開啟 <code>epi-ems.Rproj</code>，再打開 <code>R/weeks/w${pad(w.n)}.R</code>。</li>
      <li>由上往下逐段執行（<kbd>Ctrl</kbd>+<kbd>Enter</kbd>），每段跑完對照下方「參考輸出」。數字不同時，先檢查是不是跳過了前面的段落。</li>
      <li>把每段輸出用自己的話寫成一句結論，例如「Hill 區粗率較高，主要是年齡結構造成」。</li>
    </ol>${w.tryit ? `<div class="tryit"><b>動手改一改：</b>${esc(w.tryit)}</div>` : ""}</div>`;
  }

  function renderWeek(n) {
    const w = C.weeks.find(x => x.n === n); if (!w) return renderHome();
    const chunks = CODE["w" + pad(n)] || [];
    const phase = C.phases.find(p => p.id === w.phase);
    const inds = IND.filter(x => x.weeks.includes(n));
    const prev = C.weeks.find(x => x.n === n - 1), next = C.weeks.find(x => x.n === n + 1);
    view.innerHTML = `
      <div class="eyebrow">W${pad(n)} · ${w.date} · ${phase.name}${w.exam ? " · 考試" : ""}${w.flexible ? " · 彈性教學" : ""}</div>
      <h1 class="wtitle">${esc(w.title)}</h1>
      <p class="lede">${esc(w.lede)}</p>
      <div class="grid2">
        <div class="box"><h3>學習目標</h3><ul>${w.goals.map(g => `<li>${esc(g)}</li>`).join("")}</ul>
          ${w.flexible ? `<p class="note" style="margin:8px 0 0">形式：${esc(w.flexible)}</p>` : ""}</div>
        ${w.report ? `<div class="box report"><h3>年報對照</h3><a href="${w.report.url}" target="_blank" rel="noopener">${esc(w.report.name)}</a>
          <p class="q">${esc(w.report.task)}</p>${w.extraReport ? `<p class="q note">延伸：<a href="${w.extraReport.url}" target="_blank" rel="noopener">${esc(w.extraReport.name)}</a></p>` : ""}</div>` : ""}
      </div>
      ${inds.length ? `<h2 class="sec">${w.exam ? "考試範圍指標" : "本週指標"}</h2><div class="inds">${inds.map(x => indCard(x, false)).join("")}</div>` : ""}
      ${w.haddon ? haddonTable() : ""}${w.dag ? dagSvg() : ""}${w.checklist ? checklistTable() : ""}
      ${w.data.length ? `<div class="box" style="margin-bottom:22px"><h3>本週資料</h3><div class="chips">${w.data.map(f => `<a class="chip" href="#data">${f}</a>`).join("")}</div></div>` : ""}
      ${chunks.length ? `<h2 class="sec">R 實作</h2>${studioBox(w, true)}<div class="chunks">${chunks.map((c, i) => chunkHtml(n, c, i)).join("")}</div>` : ""}
      <div class="bar" style="margin-top:36px;justify-content:space-between">
        ${prev ? `<a href="#w${pad(prev.n)}">← W${pad(prev.n)} ${esc(prev.title)}</a>` : "<span></span>"}
        ${next ? `<a href="#w${pad(next.n)}">W${pad(next.n)} ${esc(next.title)} →</a>` : ""}
      </div>`;
  }

  function hl(code) { return esc(code).split("\n").map(l => l.replace(/(^|\s)(#.*)$/, '$1<span class="cm">$2</span>')).join("\n") }
  function chunkHtml(n, c, i) {
    const id = `w${pad(n)}-${i}`;
    return `<section class="chunk" id="${id}">
      <h2><span class="k">${pad(i + 1)}</span>${esc(c.title)}</h2>
      ${c.text ? `<p class="ex">${esc(c.text)}</p>` : ""}
      <pre class="code" id="code-${id}">${hl(c.code)}</pre>
      <div class="bar"><button data-copy="${id}">複製這段</button></div>
      <div class="out">
        ${c.output || c.plot ? `<div class="lab">參考輸出</div>` : ""}
        ${c.output ? `<pre class="res">${esc(c.output)}</pre>` : ""}
        ${c.plot ? `<div class="fig"><img src="${c.plot}" alt="${esc(c.title)} 的圖" loading="lazy"></div>` : ""}
      </div>
    </section>`;
  }
  async function onCopy(e) {
    const b = e.currentTarget, pre = document.getElementById("code-" + b.dataset.copy);
    try { await navigator.clipboard.writeText(pre.textContent); b.textContent = "已複製" }
    catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "已選取，請按 Ctrl+C" }
    setTimeout(() => b.textContent = "複製這段", 1600);
  }

  route();
})();
</script>
</body></html>
