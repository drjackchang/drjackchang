<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>流行病學方法論 EMS 版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: LMS shell — sticky top bar (course, search, download), left course menu (resources + modules with progress), main column with breadcrumb, unit header and tabbed unit content. Base type 18px for long reading sessions. */
:root {
  --bg: #f3f5f6;
  --surface: #ffffff;
  --surface-2: #f8fafa;
  --ink: #15212a;
  --muted: #56666f;
  --line: #d8e0e3;
  --accent: #0b6a6d;
  --accent-ink: #ffffff;
  --accent-soft: #e1efee;
  --signal: #a85a12;
  --signal-soft: #f8ebdc;
  --code-bg: #0f1d24;
  --code-ink: #dbe7ea;
  --ok: #2c7a47;
  --bad: #b0392d;
  --font-display: "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side: 300px;
  --top: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d161b; --surface: #142229; --surface-2: #182a32; --ink: #e4ecef; --muted: #9aadb5; --line: #27373f;
  --accent: #52b6b2; --accent-ink: #062224; --accent-soft: #173a3c; --signal: #e3a466; --signal-soft: #392918;
  --code-bg: #08121a; --code-ink: #d6e3e6; --ok: #6cc28c; --bad: #ec8274; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d161b; --surface: #142229; --surface-2: #182a32; --ink: #e4ecef; --muted: #9aadb5; --line: #27373f;
  --accent: #52b6b2; --accent-ink: #062224; --accent-soft: #173a3c; --signal: #e3a466; --signal-soft: #392918;
  --code-bg: #08121a; --code-ink: #d6e3e6; --ok: #6cc28c; --bad: #ec8274; color-scheme: dark }

* { box-sizing: border-box }
html { font-size: 18px }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.85 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface) }
a { color: var(--accent) }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; margin: 0 }
button { font: inherit; cursor: pointer }
code, kbd { font-family: var(--font-mono); font-size: .88em }
p code, li code, td code, .note code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; background: var(--surface) }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--top); background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.course { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0 }
.badge { background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-weight: 600; font-size: 13px; padding: 4px 8px; border-radius: 6px; white-space: nowrap }
.course b { font-family: var(--font-display); font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.search { position: relative; flex: 1; max-width: 460px; margin-left: auto }
.search input { width: 100%; font: inherit; font-size: .9rem; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink) }
.results { position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.14); max-height: 60vh; overflow-y: auto; z-index: 25 }
.results a { display: block; padding: 10px 14px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); font-size: .92rem; line-height: 1.5 }
.results a:last-child { border-bottom: 0 } .results a:hover, .results a:focus { background: var(--accent-soft) }
.results small { display: block; color: var(--muted); font-size: .8rem }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 500; font-size: .92rem; white-space: nowrap }
.btn.ghost { background: transparent; color: var(--accent) }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: .9rem }

/* shell */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100vh - var(--top)) }
.side { background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top) - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding-block: 18px 40px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px }
.navgrp { margin-bottom: 18px }
.navgrp > h4 { margin: 0 0 6px 10px; font-size: 12.5px; letter-spacing: .14em; color: var(--muted); font-weight: 700 }
.nav a { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: .92rem; line-height: 1.45 }
.nav a:hover { background: var(--accent-soft) }
.nav a.on { background: var(--accent); color: var(--accent-ink) }
.nav a .no { font-family: var(--font-mono); font-size: 13px; color: var(--muted); min-width: 32px }
.nav a.on .no { color: inherit; opacity: .85 }
.nav a .t { flex: 1; min-width: 0 }
.tick { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none }
.tick.done { background: var(--ok); border-color: var(--ok); position: relative }
.tick.done::after { content: ""; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) }
details.mod > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: .95rem }
details.mod > summary::-webkit-details-marker { display: none }
details.mod > summary:hover { background: var(--surface-2) }
details.mod > summary span { font-weight: 400; font-size: .8rem; color: var(--muted) }
.prog { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden }
.prog i { display: block; height: 100%; background: var(--ok); border-radius: 999px }

main { min-width: 0; padding-block: 26px 80px; padding-left: clamp(16px, 4vw, 56px); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 980px }
.crumb { font-size: .85rem; color: var(--muted); margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px }
.crumb a { color: var(--muted) }
.eyebrow { font-family: var(--font-mono); font-size: .82rem; letter-spacing: .06em; color: var(--signal) }
.h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 3.2vw, 2.15rem); margin: 6px 0 10px }
.lede { font-size: 1.1rem; max-width: 60ch; margin: 0 0 16px }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px }
.chip { font-size: .82rem; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); text-decoration: none; line-height: 1.6 }
.chip.mono { font-family: var(--font-mono) }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin: 8px 0 24px; overflow-x: auto; scrollbar-width: thin }
.tabs a { padding: 10px 16px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -2px; font-size: .95rem }
.tabs a:hover { color: var(--ink) }
.tabs a.on { color: var(--accent); border-bottom-color: var(--accent) }
.tabs a .n { font-size: .78rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin-left: 6px; color: var(--muted) }

/* blocks */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0 }
.card h3 { font-size: .85rem; letter-spacing: .1em; color: var(--muted); font-weight: 700; margin-bottom: 8px }
.card ul, .card ol { margin: 0; padding-left: 1.3em }
.card.report { background: var(--signal-soft); border-color: transparent } .card.report h3 { color: var(--signal) }
.steps { counter-reset: s; list-style: none; padding: 0 !important; display: grid; gap: 8px }
.steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start }
.steps li::before { content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: .85rem; margin-top: 3px }
.sec { font-family: var(--font-display); font-size: 1.35rem; margin: 34px 0 14px }
.note { font-size: .88rem; color: var(--muted); max-width: 72ch }

/* terms */
.terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px }
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0 }
.term header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 6px }
.term header b { font-size: 1.08rem } .term header i { font-style: normal; color: var(--muted); font-size: .82rem }
.term p { margin: 0 }
.term .ex { margin-top: 8px; font-size: .9rem; color: var(--signal); padding-left: 10px; border-left: 3px solid var(--signal-soft) }
.term .go { display: inline-block; margin-top: 8px; font-size: .85rem }

/* indicators */
.inds { display: grid; gap: 16px }
.ind { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; min-width: 0 }
.ind header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 6px }
.ind header b { font-size: 1.15rem } .ind header i { font-style: normal; color: var(--muted); font-size: .85rem }
.ind .def { margin: 0 0 10px; max-width: 72ch }
.formula { font-family: var(--font-mono); font-size: .88rem; background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; overflow-x: auto; white-space: pre-wrap }
.ind dl { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: .95rem }
.ind dt { color: var(--muted); font-weight: 700; font-size: .85rem; padding-top: 2px } .ind dd { margin: 0 } .ind dd.ex { color: var(--signal) }
.ind .wks { font-size: .82rem; color: var(--muted); margin-top: 10px }

/* animations */
.anim { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 22px; min-width: 0 }
.anim h3 { font-size: 1.15rem; margin-bottom: 6px } .anim > p { margin: 0 0 12px; color: var(--muted); font-size: .95rem; max-width: 72ch }
.anim-svg { width: 100%; height: auto; max-width: 680px; display: block }
.anim-svg .lbl { fill: var(--ink); font-size: 13px; font-family: var(--font-body) }
.anim-svg .lbl.inv { fill: #fff; font-size: 12px }
.anim-svg .big { fill: var(--ink); font-size: 17px; font-weight: 700; font-family: var(--font-body) }
.anim-svg .mk { fill: var(--bad); font-size: 16px; font-weight: 700 }
.anim-ctl { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin: 12px 0 }
.anim-ctl label { display: flex; flex-direction: column; gap: 2px; font-size: .9rem; min-width: 200px }
.anim-ctl label.chk { flex-direction: row; align-items: center; gap: 8px; min-width: 0 }
.anim-ctl input[type=range] { width: 220px; max-width: 100%; accent-color: var(--accent) }
.anim-btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 7px 16px; font-size: .9rem }
.anim-btn.ghost { background: transparent; color: var(--accent) }
.anim-btn:disabled { opacity: .5; cursor: default }
.anim-out { background: var(--surface-2); border-radius: 10px; padding: 12px 16px; font-size: .95rem; line-height: 1.75; font-variant-numeric: tabular-nums }
.legend { font-size: .85rem; color: var(--muted); margin: 4px 0 8px }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 3px }
.sw.ok { background: var(--ok) } .sw.bad { background: var(--bad) } .sw.sig { background: var(--signal) } .sw.mu { background: var(--line) }
.dots { display: grid; grid-template-columns: repeat(50, 1fr); gap: 2px; max-width: 600px }
.dots i { aspect-ratio: 1; border-radius: 50%; background: var(--line); transition: background .25s }
.dots i.ok { background: var(--ok) } .dots i.bad { background: var(--bad) } .dots i.sig { background: var(--signal) }
.grid15 { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; max-width: 520px }
.grid15 span { aspect-ratio: 1; border-radius: 3px; background: color-mix(in srgb, var(--accent) calc(var(--p) * 100%), var(--surface-2)); border: 2px solid transparent }
.grid15 span.pick { border-color: var(--signal) }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.kv div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: grid }
.kv span { font-size: .8rem; color: var(--muted) } .kv b { font-size: 1.25rem; font-variant-numeric: tabular-nums } .kv small { font-size: .78rem; color: var(--muted) }
table.mini input { width: 90px; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink) }

/* code */
.chunks { display: grid; gap: 30px }
.chunk h3 { font-size: 1.1rem; display: flex; gap: 10px; align-items: baseline }
.chunk h3 .k { font-family: var(--font-mono); font-size: .85rem; color: var(--muted); font-weight: 400 }
.chunk p.ex { margin: 6px 0 10px; max-width: 70ch; white-space: pre-line }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 16px 18px; font-family: var(--font-mono); font-size: .84rem; line-height: 1.65; overflow-x: auto; white-space: pre }
pre.code .cm { color: #8fb3a8 }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center }
.bar button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 14px; font-size: .88rem }
.out { margin-top: 10px; display: grid; gap: 8px }
.out .lab { font-size: .78rem; letter-spacing: .1em; color: var(--muted); font-weight: 700 }
pre.res { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; font-family: var(--font-mono); font-size: .8rem; line-height: 1.55; overflow-x: auto; white-space: pre; font-variant-numeric: tabular-nums }
.fig { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px; max-width: 680px } .fig img { display: block; width: 100%; height: auto }
.studio { background: var(--surface); border: 2px dashed var(--accent); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px }
.studio h3 { font-size: 1rem; color: var(--accent); margin-bottom: 6px } .studio ol { margin: 0; padding-left: 1.3em }
.tryit { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line) } .tryit b { color: var(--signal) }

/* tables */
.tblwrap, .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: .92rem }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: .82rem; color: var(--muted); font-weight: 700; background: var(--surface-2) }
tr:last-child td { border-bottom: 0 }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap }
details.cols summary { cursor: pointer; color: var(--accent); font-size: .85rem }
dl.cols { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 8px 0 0; font-size: .85rem } dl.cols dt { font-family: var(--font-mono); color: var(--accent) } dl.cols dd { margin: 0 }
.refs { display: grid; gap: 12px; padding: 0; list-style: none }
.refs li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px }
.refs .u { display: block; margin-top: 6px; font-size: .9rem; color: var(--muted) }
.tb { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 6px 14px; margin: 0 } .tb dt { color: var(--muted); font-weight: 700; font-size: .88rem } .tb dd { margin: 0 }

/* home */
.dash { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin: 18px 0 26px }
.next { background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 22px 24px; display: grid; gap: 6px; text-decoration: none; align-content: start }
.next .eyebrow { color: inherit; opacity: .85 } .next b { font-family: var(--font-display); font-size: 1.4rem; line-height: 1.35 } .next span { opacity: .9 }
.mods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px }
.mod-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; align-content: start }
.mod-card h3 { font-family: var(--font-display); font-size: 1.2rem } .mod-card .r { font-family: var(--font-mono); font-size: .8rem; color: var(--signal) }
.mod-card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.mod-card li a { display: flex; gap: 8px; align-items: center; text-decoration: none; color: var(--ink); font-size: .9rem; padding: 3px 0 }
.unitbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line) }
.donebtn { border: 2px solid var(--ok); background: transparent; color: var(--ok); border-radius: 999px; padding: 8px 18px; font-weight: 700 }
.donebtn.done { background: var(--ok); color: #fff }
.filter { width: 100%; max-width: 420px; font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); margin-bottom: 16px }
.matrix td, .matrix th { min-width: 120px }

@media (max-width: 980px) { .dash { grid-template-columns: minmax(0, 1fr) } .mods { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 860px) {
  html { font-size: 17px }
  .shell { grid-template-columns: minmax(0, 1fr) }
  .side { position: fixed; inset: calc(var(--top) + env(safe-area-inset-top, 0px)) 0 0 0; height: auto; z-index: 15; display: none; padding-right: max(14px, env(safe-area-inset-right, 0px)) }
  .side.open { display: block }
  .menu-btn { display: inline-block }
  .top .btn { display: none }
  .search { max-width: none }
  .course b { display: none }
  .ind dl, .tb { grid-template-columns: minmax(0, 1fr) }
  .grid2, .terms { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: no-preference) { .view { animation: fade .2s ease-out } @keyframes fade { from { opacity: .5 } to { opacity: 1 } } }
</style>

<header class="top">
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">選單</button>
  <a class="course" href="#home"><span class="badge">EPI-EMS 115-2</span><b>流行病學方法論</b></a>
  <div class="search"><input id="q" type="search" placeholder="搜尋名詞、指標或單元（例如：SMR、設限）" autocomplete="off" aria-label="搜尋"><div class="results" id="qres" hidden></div></div>
  <a class="btn" href="epi-ems-rstudio.zip" download>下載 R 專案</a>
</header>
<div class="shell">
  <aside class="side" id="side"><nav class="nav" id="nav"></nav></aside>
  <main><div class="wrap"><div id="view" class="view"></div></div></main>
</div>

<script src="weeks.js"></script>
<script src="terms.js"></script>
<script src="indicators.js"></script>
<script src="refs.js"></script>
<script src="anim_data.js"></script>
<script src="anim.js"></script>
<script src="outputs.js"></script>
<script>
(function () {
  const C = window.COURSE, D = window.DATASETS, IND = window.INDICATORS || [], T = window.TERMS || {}, R = window.WEEK_REFS || {}, TB = window.TEXTBOOKS || {}, AN = window.ANIM || {}, CODE = window.WEEK_CODE || {};
  const pad = n => String(n).padStart(2, "0");

  function chunkHtml(n, c, i) {
    const id = `w${pad(n)}-${i}`;
    return `<section class="chunk"><h3><span class="k">${pad(i + 1)}</span>${esc(c.title)}</h3>${c.text ? `<p class="ex">${esc(c.text)}</p>` : ""}
      <pre class="code" id="code-${id}">${hl(c.code)}</pre><div class="bar"><button data-copy="${id}">複製這段</button></div>
      <div class="out">${c.output || c.plot ? `<div class="lab">參考輸出</div>` : ""}${c.output ? `<pre class="res">${esc(c.output)}</pre>` : ""}${c.plot ? `<div class="fig"><img src="${c.plot}" alt="${esc(c.title)} 的圖" loading="lazy"></div>` : ""}</div></section>`;
  }
  async function onCopy(e) {
    const b = e.currentTarget, pre = document.getElementById("code-" + b.dataset.copy);
    try { await navigator.clipboard.writeText(pre.textContent); b.textContent = "已複製" }
    catch { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "已選取，請按 Ctrl+C" }
    setTimeout(() => b.textContent = "複製這段", 1600);
  }

  function renderWeek(n, tab) {
    const w = C.weeks.find(x => x.n === n); if (!w) return renderHome();
    const terms = T[n] || [], inds = IND.filter(x => x.weeks.includes(n)), chunks = CODE["w" + pad(n)] || [], ref = R[n] || {};
    const anims = [...new Set(terms.map(x => x.anim).filter(a => a && AN[a]))];
    const tabs = [["ov", "概覽"], ["terms", "名詞", terms.length], ["ind", "指標", inds.length], ["anim", "動畫", anims.length], ["r", "R 實作", chunks.length], ["refs", "教科書與文獻", (ref.refs || []).length]]
      .filter(t => t[0] === "ov" || t[0] === "refs" || t[2]);
    if (!tabs.find(t => t[0] === tab)) tab = "ov";
    const prev = C.weeks.find(x => x.n === n - 1), next = C.weeks.find(x => x.n === n + 1);
    let body = "";
    if (tab === "ov") {
      const flow = [terms.length && `讀「名詞」分頁的 ${terms.length} 個名詞`, anims.length && `操作 ${anims.length} 個「動畫」`, inds.length && `讀懂 ${inds.length} 個「指標」的定義與用法`,
        w.report && `完成「年報對照」題`, chunks.length && `在 RStudio 跑完 w${pad(n)}.R 並對照參考輸出`, w.tryit && `做「動手改一改」`].filter(Boolean);
      body = `<div class="grid2">
        <div class="card"><h3>學習目標</h3><ul>${w.goals.map(g => `<li>${esc(g)}</li>`).join("")}</ul>${w.flexible ? `<p class="note" style="margin:8px 0 0">形式：${esc(w.flexible)}</p>` : ""}</div>
        ${flow.length ? `<div class="card"><h3>本週學習流程</h3><ol class="steps">${flow.map(s => `<li>${s}</li>`).join("")}</ol></div>` : ""}
        ${w.report ? `<div class="card report"><h3>年報對照</h3><a href="${w.report.url}" target="_blank" rel="noopener">${esc(w.report.name)}</a><p style="margin:6px 0 0">${esc(w.report.task)}</p>
          ${w.extraReport ? `<p class="note" style="margin:6px 0 0">延伸：<a href="${w.extraReport.url}" target="_blank" rel="noopener">${esc(w.extraReport.name)}</a></p>` : ""}</div>` : ""}
        <div class="card"><h3>教科書</h3><dl class="tb"><dt>Gordis</dt><dd>${esc(ref.G || "—")}</dd><dt>史麗珠</dt><dd>${esc(ref.S || "—")}</dd>${ref.ext ? `<dt>延伸</dt><dd>${esc(ref.ext)}</dd>` : ""}</dl></div>
      </div>
      ${w.data.length ? `<div class="chips">${w.data.map(f => `<a class="chip mono" href="#data">${f}</a>`).join("")}</div>` : ""}
      ${w.haddon ? haddonTable() : ""}${w.checklist ? checklistTable() : ""}`;
    } else if (tab === "terms") {
      body = `<p class="note">先讀懂這些名詞再進入指標與實作。有「看動畫」的名詞，可以到動畫分頁操作。</p><div class="terms">${terms.map(x => termCard(x, n, false)).join("")}</div>`;
    } else if (tab === "ind") {
      body = `<div class="inds">${inds.map(x => indCard(x, x.weeks.length > 1)).join("")}</div>`;
    } else if (tab === "anim") {
      body = anims.map(k => `<section class="anim"><h3>${esc(AN[k].title)}</h3><p>${esc(AN[k].desc)}</p><div data-anim="${k}"></div></section>`).join("");
    } else if (tab === "r") {
      body = `<div class="studio"><h3>在 RStudio 跟著做</h3><ol>
        <li>開啟 <code>epi-ems.Rproj</code>，再打開 <code>R/weeks/w${pad(n)}.R</code>。</li>
        <li>由上往下逐段執行（<kbd>Ctrl</kbd>+<kbd>Enter</kbd>），每段跑完對照下方參考輸出。</li>
        <li>把每段輸出用自己的話寫成一句結論。</li></ol>${w.tryit ? `<div class="tryit"><b>動手改一改：</b>${esc(w.tryit)}</div>` : ""}</div>
        <div class="chunks">${chunks.map((c, i) => chunkHtml(n, c, i)).join("")}</div>`;
    } else if (tab === "refs") {
      body = `<div class="card" style="margin-bottom:20px"><h3>教科書對應章節</h3><dl class="tb"><dt>Gordis</dt><dd>${esc(ref.G || "—")}</dd><dt>史麗珠</dt><dd>${esc(ref.S || "—")}</dd>${ref.ext ? `<dt>延伸</dt><dd>${esc(ref.ext)}</dd>` : ""}</dl></div>
        ${(ref.refs || []).length ? `<h2 class="sec" style="margin-top:0">實際使用這些方法的研究</h2><ul class="refs">${ref.refs.map(x => `<li><a href="${x.url}" target="_blank" rel="noopener">${esc(x.cite)}</a><span class="u">${esc(x.uses)}</span></li>`).join("")}</ul>` : `<p class="note">考試週沒有新文獻，請複習各週文獻。</p>`}`;
    }
    view.innerHTML = crumb([["課程首頁", "#home"], [PH[w.phase], `#w${pad(C.weeks.find(x => x.phase === w.phase).n)}`], [`W${pad(n)}`]]) + `
      <div class="eyebrow">W${pad(n)} · ${w.date}${w.exam ? " · 考試" : ""}${w.flexible ? " · 彈性教學" : ""}</div>
      <h1 class="h1">${esc(w.title)}</h1><p class="lede">${esc(w.lede)}</p>
      <nav class="tabs" aria-label="單元分頁">${tabs.map(t => `<a href="#w${pad(n)}${t[0] === "ov" ? "" : "-" + t[0]}" class="${t[0] === tab ? "on" : ""}">${t[1]}${t[2] ? `<span class="n">${t[2]}</span>` : ""}</a>`).join("")}</nav>
      ${body}
      <div class="unitbar">${prev ? `<a href="#w${pad(prev.n)}">← W${pad(prev.n)} ${esc(prev.title)}</a>` : "<span></span>"}
        <button class="donebtn ${done.has(n) ? "done" : ""}" id="doneBtn">${done.has(n) ? "✓ 本週已完成" : "標記本週已完成"}</button>
        ${next ? `<a href="#w${pad(next.n)}">W${pad(next.n)} ${esc(next.title)} →</a>` : "<span></span>"}</div>`;
    view.querySelectorAll("[data-anim]").forEach(el => { try { AN[el.dataset.anim].mount(el) } catch (e) { el.textContent = "動畫載入失敗：" + e.message } });
    view.querySelector("#doneBtn").addEventListener("click", e => { done.has(n) ? done.delete(n) : done.add(n); setDone(done); renderNav();
      e.currentTarget.classList.toggle("done", done.has(n)); e.currentTarget.textContent = done.has(n) ? "✓ 本週已完成" : "標記本週已完成" });
  }

  renderNav(); route();
})();
</script>
</body></html>
